<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuzzywumpets B2B Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --lime:#9BBC0E; --marquee:#D9E8FF; --blue:#2086BA; --ink:#000; --muted:#5a5a5a; --ivory:#fff; }
  *{box-sizing:border-box}html,body{margin:0;padding:0;height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--marquee);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:var(--ivory);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.08);padding:48px 40px;max-width:480px;width:100%;text-align:center}
  .lime-accent{display:inline-block;width:40px;height:4px;background:var(--lime);border-radius:2px;margin:0 0 18px}
  .brand{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;margin:0 0 4px}
  .tagline{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin:0 0 28px}
  h1{font-family:'Playfair Display',serif;font-size:22px;margin:0 0 12px}
  p{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 8px}
  .build-info{margin-top:24px;padding-top:20px;border-top:1px solid #eee;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="lime-accent"></div>
    <p class="brand">Fuzzywumpets</p>
    <p class="tagline">B2B Admin · Operator Console</p>
    <h1>Building…</h1>
    <p>This is the internal operations dashboard. The overnight build loop is scaffolding it now — check back shortly.</p>
    <div class="build-info">b2badmin.fuzzywumpets.com · Phase 0</div>
  </div>
</body>
</html>
