name: Desktop Shell — Build & Release

# WHAT: Builds + releases the Electron desktop shell that lives in desktop/.
# DEPENDS: desktop/package.json's build.publish block — electron-builder bakes that
#   owner/repo into resources/app-update.yml inside the installer, and the INSTALLED
#   app reads it to find its update feed. If publish.repo and the repo this workflow
#   releases into ever disagree, already-installed clients silently stop updating.
# CHANGE-GUARD: the tag MUST be `v<version>` matching desktop/package.json's "version".
#   Two publishers write to the release on a tag build: electron-builder's own GitHub
#   publisher (it uploads the hyphen-named .exe, its .blockmap, and the latest.yml that
#   electron-updater actually reads) and the softprops step below. electron-builder
#   derives its release tag from `v${version}` and ignores the git tag name, so a tag
#   that is not exactly `v${version}` splits the assets across TWO releases and leaves
#   latest.yml pointing at an .exe that isn't on the same release — a broken update feed.
#   This repo has no other tags and no tag-driven server release, so `v*` is uncontended;
#   if the server ever gains tags, prefix them rather than re-prefixing this.
#   The "Verify tag matches" step below ENFORCES this — it is not merely documentation.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # Enforces the invariant the CHANGE-GUARD above describes. Fails BEFORE the build
      # so a mistag costs 20 seconds instead of publishing a half-broken release that
      # then has to be deleted (and deleting a release that clients may already have
      # polled is exactly the mess this avoids).
      - name: Verify tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match desktop/package.json version '$pkg' (expected 'v$pkg')."
            echo "electron-builder publishes under v\$version regardless of the git tag name, so a"
            echo "mismatch scatters the .exe/.blockmap/latest.yml across two releases and leaves"
            echo "latest.yml pointing at an installer that is not on the same release."
            exit 1
          fi
          echo "Tag '$GITHUB_REF_NAME' matches desktop version '$pkg'."

      - name: Install dependencies
        run: npm ci

      # DEPENDS: repo secrets WINDOWS_CSC_LINK (base64 PFX) + WINDOWS_CSC_KEY_PASSWORD.
      #   electron-builder picks CSC_LINK/CSC_KEY_PASSWORD up from the environment with no
      #   config needed. Master copies live in Doppler (fww-shared/prd) under the same
      #   names, alongside WINDOWS_CSC_THUMBPRINT.
      # CHANGE-GUARD: the cert is SELF-SIGNED, so it only suppresses Windows' unknown-
      #   publisher warnings on machines that have it in Trusted Root (see
      #   desktop/install-codesign-cert.ps1). It must also stay in sync with
      #   desktop/package.json's win.publisherName — electron-updater compares the
      #   installer's certificate subject against that string and REFUSES an update that
      #   doesn't match, so changing the cert's CN without changing publisherName (or vice
      #   versa) silently breaks auto-update for everyone already installed.
      - name: Build NSIS installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      # An unsigned build would still publish happily and then trip exactly the warnings
      # this signing exists to remove, so fail loudly instead of shipping one.
      - name: Verify the installer is signed
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          "Installer : $($exe.Name)"
          "Status    : $($sig.Status)"
          "Signer    : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Error "Installer is NOT signed - check the WINDOWS_CSC_* repo secrets."
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'CN=Fuzzywumpets') {
            Write-Error "Signed by an unexpected certificate: $($sig.SignerCertificate.Subject)"
            exit 1
          }
          "OK - signed by the expected certificate."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: desktop/dist/*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
