name: Desktop Shell — Build & Release

# WHAT: Builds the Electron desktop shell that lives in desktop/, and publishes the release to the
#   SEPARATE PUBLIC repo Fuzzywumpets/fww-b2b-admin-desktop.
# CHANGE-GUARD: the release does NOT go to this repo, and must not be "simplified" to do so. This
#   repo is PRIVATE, and electron-updater fetches releases.atom unauthenticated — against a private
#   repo GitHub answers 404 and every installed client breaks with "Could not check for updates."
#   That is not hypothetical: it shipped in 1.0.2 and broke the only install. The source lives here;
#   only the published artifacts live in the public repo.
# DEPENDS: desktop/package.json's build.publish block — electron-builder bakes that owner/repo into
#   resources/app-update.yml inside the installer, and the INSTALLED app reads it to find its update
#   feed. It must name the PUBLIC repo, and must match what this workflow releases into, or
#   already-installed clients silently stop updating.
# DEPENDS: repo secret RELEASE_TOKEN — a cross-repo token, because the default GITHUB_TOKEN is scoped
#   to this repo only and cannot create a release in the desktop repo.
# CHANGE-GUARD: the tag MUST be `v<version>` matching desktop/package.json's "version".
#   Two publishers write to the release on a tag build: electron-builder's own GitHub
#   publisher (it uploads the hyphen-named .exe, its .blockmap, and the latest.yml that
#   electron-updater actually reads) and the softprops step below. electron-builder
#   derives its release tag from `v${version}` and ignores the git tag name, so a tag
#   that is not exactly `v${version}` splits the assets across TWO releases and leaves
#   latest.yml pointing at an .exe that isn't on the same release — a broken update feed.
#   This repo has no other tags and no tag-driven server release, so `v*` is uncontended;
#   if the server ever gains tags, prefix them rather than re-prefixing this.
#   The "Verify tag matches" step below ENFORCES this — it is not merely documentation.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # Enforces the invariant the CHANGE-GUARD above describes. Fails BEFORE the build
      # so a mistag costs 20 seconds instead of publishing a half-broken release that
      # then has to be deleted (and deleting a release that clients may already have
      # polled is exactly the mess this avoids).
      - name: Verify tag matches desktop/package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$pkg" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match desktop/package.json version '$pkg' (expected 'v$pkg')."
            echo "electron-builder publishes under v\$version regardless of the git tag name, so a"
            echo "mismatch scatters the .exe/.blockmap/latest.yml across two releases and leaves"
            echo "latest.yml pointing at an installer that is not on the same release."
            exit 1
          fi
          echo "Tag '$GITHUB_REF_NAME' matches desktop version '$pkg'."

      - name: Install dependencies
        run: npm ci

      # DEPENDS: repo secrets WINDOWS_CSC_LINK (base64 PFX) + WINDOWS_CSC_KEY_PASSWORD.
      #   electron-builder picks CSC_LINK/CSC_KEY_PASSWORD up from the environment with no
      #   config needed. Master copies live in Doppler (fww-shared/prd) under the same
      #   names, alongside WINDOWS_CSC_THUMBPRINT.
      # CHANGE-GUARD: the cert is SELF-SIGNED, so it only suppresses Windows' unknown-
      #   publisher warnings on machines that have it in Trusted Root (see
      #   desktop/install-codesign-cert.ps1). It must also stay in sync with
      #   desktop/package.json's win.publisherName — electron-updater compares the
      #   installer's certificate subject against that string and REFUSES an update that
      #   doesn't match, so changing the cert's CN without changing publisherName (or vice
      #   versa) silently breaks auto-update for everyone already installed.
      - name: Build NSIS installer
        run: npm run dist
        env:
          # RELEASE_TOKEN, not GITHUB_TOKEN: electron-builder's own publisher uploads into the
          # separate public desktop repo, which the repo-scoped default token cannot write to.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      # An unsigned build would still publish happily and then trip exactly the warnings
      # this signing exists to remove, so fail loudly instead of shipping one.
      # Runs on EVERY build (not just tags) — a workflow_dispatch build that silently
      # came out unsigned would hide a broken secret until the next release.
      # SYNC: EXPECTED_THUMBPRINT must equal the thumbprint in
      #   desktop/install-codesign-cert.ps1 and the cert behind WINDOWS_CSC_LINK. A
      #   thumbprint is a public fingerprint, not a secret, so it is pinned in the clear
      #   on purpose — pinning it is what makes this a real identity check.
      - name: Verify the installer is signed
        shell: pwsh
        run: |
          $EXPECTED_THUMBPRINT = '2CDFA8AEDA884BDEDC14B7B6AF91EB31B15A9928'

          $exes = @(Get-ChildItem dist/*.exe -ErrorAction SilentlyContinue)
          if ($exes.Count -eq 0) { Write-Error "No installer produced in dist/."; exit 1 }

          $failed = $false
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "--- $($exe.Name)"
            "    Status     : $($sig.Status)"
            "    Thumbprint : $($sig.SignerCertificate.Thumbprint)"
            "    Subject    : $($sig.SignerCertificate.Subject)"

            # Require Valid outright. NotSigned is only one of several bad states —
            # HashMismatch, NotTrusted and UnknownError all mean a broken installer and
            # must not reach a release either.
            if ($sig.Status -ne 'Valid') {
              Write-Error "  $($exe.Name): signature status is '$($sig.Status)', expected 'Valid'."
              $failed = $true
              continue
            }
            # Exact thumbprint, not a subject substring: 'CN=Fuzzywumpets Impostor Ltd'
            # would satisfy a substring match on 'CN=Fuzzywumpets'.
            if ($sig.SignerCertificate.Thumbprint -ne $EXPECTED_THUMBPRINT) {
              Write-Error "  $($exe.Name): signed by unexpected cert $($sig.SignerCertificate.Thumbprint), expected $EXPECTED_THUMBPRINT."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          "OK - all $($exes.Count) installer(s) validly signed by the expected certificate."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: desktop/dist/*.exe

      # SYNC: `repository` here and desktop/package.json's build.publish must name the SAME repo, and
      #   it must be the PUBLIC one — see the CHANGE-GUARD at the top. generate_release_notes is off
      #   because the tag lives in THIS repo while the release lives in the other one, so there is no
      #   commit range for the target repo to generate notes from.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Fuzzywumpets/fww-b2b-admin-desktop
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Desktop shell ${{ github.ref_name }}.

            Source lives in the private repo `Fuzzywumpets/fww-b2b-admin` under `desktop/`;
            only the built installer is published here so `electron-updater` can read the feed
            without authentication.
          files: |
            desktop/dist/*.exe
            desktop/dist/*.yml
